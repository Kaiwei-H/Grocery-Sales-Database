version: 2

models:
  - name: stg_sales
    columns:
      - name: sales_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: mart_sales_overview_monthly
    columns:
      - name: sales_month
        tests:
          - not_null